<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'self'"
    />
    <title>Deck</title>
    <!-- Stamp `<html data-theme>` (resolved), `data-theme-pref`
         (user pref) and `data-chrome` (platform) synchronously, before
         any CSS evaluates. Main supplies theme + themePref via the
         `?theme=&themePref=` query on `loadFile` (see
         `src/main/window-shell.ts::initialThemeQuery`). Reading from
         the URL rather than localStorage keeps main as the single
         source of truth for the persisted pref; stamping pref here
         (not just resolved) lets Settings's Segmented control render
         the right option on first paint without waiting for the IPC
         boot fetch. KEEP IN SYNC with the equivalent block in
         `settings.html`. -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var theme = params.get('theme')
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light')
        var pref = params.get('themePref')
        document.documentElement.setAttribute(
          'data-theme-pref',
          pref === 'dark' || pref === 'light' || pref === 'auto' ? pref : 'auto',
        )
        if (!/Mac/i.test(navigator.platform)) {
          document.documentElement.setAttribute('data-chrome', 'overlay')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
