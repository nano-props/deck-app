<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'self'"
    />
    <title>Settings</title>
    <!-- KEEP IN SYNC with the equivalent block in `index.html`. -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var theme = params.get('theme')
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light')
        var pref = params.get('themePref')
        document.documentElement.setAttribute(
          'data-theme-pref',
          pref === 'dark' || pref === 'light' || pref === 'auto' ? pref : 'auto',
        )
        if (!/Mac/i.test(navigator.platform)) {
          document.documentElement.setAttribute('data-chrome', 'overlay')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./settings-main.tsx"></script>
  </body>
</html>
