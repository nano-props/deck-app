<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'self'"
    />
    <title>Settings</title>
    <!-- Synchronous theme + chrome-platform bootstrap, runs before any
         module script so the first paint already has the right
         `data-theme` (no white flash).

         KEEP IN SYNC with the equivalent block in `index.html`. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('deck:theme')
          var resolved =
            pref === 'light' || pref === 'dark'
              ? pref
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (_) {}
        if (!/Mac/i.test(navigator.platform)) {
          document.documentElement.setAttribute('data-chrome', 'overlay')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./settings-main.tsx"></script>
  </body>
</html>
