<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deck Player</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='12' y='20' width='76' height='60' rx='6' fill='none' stroke='%232f6bff' stroke-width='6'/%3E%3Crect x='24' y='34' width='52' height='6' rx='2' fill='%232f6bff'/%3E%3Crect x='24' y='48' width='36' height='4' rx='2' fill='%23c9cbce'/%3E%3Crect x='24' y='58' width='44' height='4' rx='2' fill='%23c9cbce'/%3E%3C/svg%3E"
    />
    <!--
      If the URL has a hash, we're going to restore a deck from cache.
      Mark the document so the upload page paints invisibly until the
      stage is ready (or until restore fails). Without this, refreshing
      a deck URL flashes the upload screen for ~50-100ms while the
      module script + zip work runs.
    -->
    <script>
      if (location.hash) document.documentElement.classList.add('restoring')
    </script>
    <style>
      /*
        Token names mirror docs/index.html (--ink / --mute / --line /
        --surface / --accent) so the player and the marketing site read
        as one product. Light-only here by design; if dark mode is added
        later, the token shape is already aligned with the docs page.
      */
      :root {
        color-scheme: light;
        --bg: #fafaf9;
        --surface: #ffffff;
        --ink: #111111;
        --ink-2: #3a3a3a;
        --mute: #787c82;
        --line: #e6e6e2;
        --line-2: #cdcdc7;
        --accent: #2f6bff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--ink);
        /*
          Same stack as docs/index.html. We do NOT pull in Inter as a
          web font — letting the browser fall through to system-ui (SF
          Pro on macOS, Segoe UI on Windows) keeps the player's first
          paint as fast as possible. PingFang/Noto Sans SC make Chinese
          deck names render properly.
        */
        font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', system-ui,
                     -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px; line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      body { display: flex; flex-direction: column; }

      /*
        While restoring a deck from a URL hash on first load, suppress
        the upload screen (topbar + hero) so it doesn't flash before
        the stage takes over. The class is set inline in <head> based
        on location.hash and removed by player.js after the restore
        attempt resolves (succeed → stage covers it anyway; fail →
        we want the upload screen back).
      */
      html.restoring .topbar,
      html.restoring #drop { display: none; }

      /* --- Top bar with product identity --- */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: saturate(160%) blur(10px);
        -webkit-backdrop-filter: saturate(160%) blur(10px);
        position: sticky; top: 0; z-index: 5;
      }
      .brand {
        font-weight: 600; font-size: 18px; letter-spacing: -0.015em;
      }
      .topbar .links { display: flex; align-items: center; gap: 4px; }
      .topbar .links a {
        font-size: 13px; font-weight: 500; color: var(--ink-2);
        padding: 8px 12px; border-radius: 8px;
        text-decoration: none;
        transition: color 0.2s, background 0.2s;
      }
      .topbar .links a:hover { color: var(--ink); background: var(--line); }

      /* --- Hero / drop section --- */
      /*
        The whole #drop section IS the dropzone. There's no inner card —
        users can drop anywhere on the page. We use a faint full-area
        accent overlay during drag to signal "yes, this whole space
        accepts the file" without the visual noise of a bordered box.
      */
      #drop {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 48px 24px;
        transition: background 160ms ease;
      }
      #drop.hover {
        background: color-mix(in srgb, var(--accent) 5%, transparent);
      }
      #drop .inner {
        width: 100%; max-width: 560px;
        display: flex; flex-direction: column; align-items: center;
      }
      .hero-title {
        margin: 0 0 12px;
        font-size: 36px; font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .hero-tagline {
        margin: 0 0 28px;
        color: var(--ink-2); font-size: 16px;
        text-align: center; max-width: 420px;
      }
      /*
        Primary action is a single button-styled label that opens the
        file picker. Drag-and-drop is supported on the whole #drop
        section, so users don't need a giant target — just a clear
        "browse" affordance.
      */
      .browse-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px;
        background: var(--ink); color: var(--bg);
        border: 1px solid var(--ink); border-radius: 10px;
        font-weight: 500; font-size: 15px;
        cursor: pointer;
        transition: transform 0.15s, background 0.2s;
      }
      .browse-btn:hover {
        background: var(--accent); border-color: var(--accent);
        transform: translateY(-1px);
      }
      .browse-btn:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 3px;
      }
      .browse-btn svg { display: block; }
      .browse-hint {
        margin: 12px 0 0;
        color: var(--mute); font-size: 14px;
        text-align: center;
      }

      .hero-tip {
        margin-top: 32px;
        font-size: 13px; color: var(--mute);
        text-align: center;
      }
      .hero-tip kbd {
        display: inline-block;
        padding: 1px 6px; border-radius: 4px;
        background: var(--surface); border: 1px solid var(--line);
        font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
        color: var(--ink-2);
      }

      #recents { width: 100%; margin-top: 40px; text-align: left; }
      #recents:empty { display: none; }
      #recents h2 {
        margin: 0 0 8px; font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--mute);
      }
      #recents ul { list-style: none; margin: 0; padding: 0; }
      /*
        Layout: .open is the row's main button — it's a block-level
        flex item that determines the li's height naturally. .delete
        is absolutely positioned over the right side with a higher
        stacking context, and stops click propagation so it doesn't
        also trigger .open. Using flow layout (instead of an
        absolute-positioned .open + spacer) keeps text content from
        being clipped when its intrinsic height exceeds the row.
      */
      /*
        Hover style aligns with .sec-item in docs/index.html: a subtle
        translateY lift, border-color brightening, and a soft shadow —
        everything fades over 0.2s rather than snapping. The .delete
        icon also fades in on row hover so the resting row stays clean.
      */
      #recents li {
        position: relative;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      #recents li + li { margin-top: 4px; }
      #recents li:hover {
        background: var(--surface);
        border-color: var(--line-2);
        transform: translateY(-1px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 16px rgba(0, 0, 0, 0.04);
      }
      #recents li:focus-within {
        background: var(--surface);
        border-color: var(--accent);
      }
      #recents .open {
        display: flex; flex-direction: column; width: 100%;
        padding: 10px 48px 10px 12px;  /* right padding leaves room for delete */
        background: none; border: 0; margin: 0; border-radius: inherit;
        font: inherit; color: inherit; text-align: left; cursor: pointer;
      }
      #recents .open:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
      #recents .name {
        max-width: 100%; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      #recents li:hover .name { color: var(--accent); }
      #recents .time { font-size: 13px; color: var(--mute); margin-top: 2px; }
      #recents .delete {
        position: absolute; top: 50%; right: 8px;
        transform: translateY(-50%);
        width: 32px; height: 32px; padding: 0;
        background: transparent; border: 0; border-radius: 6px;
        color: var(--mute); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        z-index: 1;
        opacity: 0;
        transition:
          opacity 0.2s ease,
          background 0.2s ease,
          color 0.2s ease,
          transform 0.15s ease;
      }
      #recents li:hover .delete,
      #recents li:focus-within .delete,
      #recents .delete:focus-visible { opacity: 1; }
      #recents .delete:hover {
        background: rgba(220, 38, 38, 0.1);
        color: #dc2626;
        transform: translateY(-50%) scale(1.08);
      }
      #recents .delete:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
      /*
        Touch devices have no hover state, so the icon would be invisible
        until focused. Show it always there.
      */
      @media (hover: none) {
        #recents .delete { opacity: 1; }
      }

      /*
        Stage covers the whole viewport when a deck is playing. We give
        it a z-index above the sticky topbar AND hide the topbar
        outright so it can't show through under any combination of
        backdrop-filter / stacking context quirks.
      */
      /*
        Stage covers the whole viewport when a deck is playing. Its
        z-index sits above the topbar (z-index: 5) and home-indicator
        backdrops, so the upload screen is fully obscured without a
        separate "hide topbar" rule. We deliberately avoid a
        :has(#stage.active) rule here — that selector triggers a
        global style recalculation which, in some browsers, lags one
        frame behind the simpler .active class toggle and produces a
        brief white flash when closing a deck.
      */
      #stage {
        position: fixed; inset: 0; display: none;
        background: var(--surface);
        z-index: 50;
      }
      #stage.active { display: block; }
      #stage iframe { width: 100%; height: 100%; border: 0; }

      /*
        "Home indicator" — a small pill at the bottom-center of the stage,
        mirroring the iPhone affordance. The only always-on player chrome
        inside a deck: click to open the command palette.

        mix-blend-mode: difference makes the pill auto-invert against
        whatever the deck draws behind it: dark backgrounds → it appears
        light, light backgrounds → it appears dark. To keep the blend
        stable we use a SOLID white fill (no alpha) — alpha + difference
        produces washed-out colors that shift on every paint. The
        translucent feel comes from `opacity` on the element instead.

        Hover/active state is expressed via opacity and scale only —
        animating the background color would re-trigger the blend math
        every frame and look glitchy.
      */
      #home-indicator {
        position: fixed;
        left: 50%; bottom: 8px;
        transform: translateX(-50%);
        z-index: 10;
        width: 120px; height: 5px;
        border: 0; padding: 0; margin: 0;
        border-radius: 999px;
        background: #ffffff;
        mix-blend-mode: difference;
        cursor: pointer;
        opacity: 0.45;
        transition: opacity 160ms ease, transform 160ms ease;
      }
      #home-indicator:hover { opacity: 0.85; }
      #home-indicator:active { transform: translateX(-50%) scaleY(0.6); }
      #home-indicator:focus-visible {
        /*
          Outline is drawn on the un-blended layer above, so it shows
          true accent color regardless of what the deck draws behind.
          isolation:isolate on the focused element pulls it out of the
          blend group for that ring.
        */
        isolation: isolate;
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* --- Undo toast (after deleting a recent deck) ---
         Quiet card style: surface background, subtle border, soft
         shadow. Should feel like a status note, not a banner. */
      #undo-toast {
        position: fixed;
        left: 50%; bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        z-index: 200;
        min-width: 280px; max-width: calc(100vw - 32px);
        background: var(--surface); color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 28px rgba(0, 0, 0, 0.08);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
        overflow: hidden;
      }
      #undo-toast.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      #undo-toast .inner {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 6px 10px 14px;
      }
      #undo-toast .msg {
        flex: 1; min-width: 0;
        font-size: 14px; color: var(--ink-2);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #undo-toast .undo {
        flex-shrink: 0;
        background: transparent; border: 0; padding: 6px 12px;
        color: var(--accent); font: inherit; font-weight: 600;
        cursor: pointer; border-radius: 6px;
        transition: background 0.15s;
      }
      #undo-toast .undo:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
      #undo-toast .undo:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }
      #undo-toast .progress {
        height: 2px;
        /* --mute (3:1) is visible against white but doesn't compete
           with the message text the way --accent or --ink would. */
        background: var(--mute);
        transform-origin: left center;
        will-change: transform;
      }

      #error {
        color: #dc2626; margin: 16px 0 0;
        font-size: 14px; text-align: center;
      }
      #error:empty { display: none; }
      #status {
        color: var(--mute); margin: 16px 0 0;
        font-size: 14px; text-align: center;
      }
      #status:empty { display: none; }

      /* --- Command palette (toggled by Cmd/Ctrl+K or ?) --- */
      #palette {
        position: fixed; inset: 0; z-index: 100;
        display: none;
        align-items: flex-start; justify-content: center;
        background: rgba(15, 17, 21, 0.35);
        backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        padding-top: max(12vh, 80px);
      }
      #palette.active { display: flex; }
      #palette .panel {
        width: min(560px, calc(100vw - 32px));
        max-height: 70vh; overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 24px 60px rgba(0, 0, 0, 0.18);
        display: flex; flex-direction: column;
        animation: palette-pop 0.16s ease-out;
      }
      @keyframes palette-pop {
        from { opacity: 0; transform: translateY(-4px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      #palette .header {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--mute);
        display: flex; align-items: center; justify-content: space-between;
      }
      #palette .hint { font-weight: 400; text-transform: none; letter-spacing: 0; }
      #palette .hint kbd {
        display: inline-block;
        padding: 1px 6px; border-radius: 4px;
        background: var(--bg); border: 1px solid var(--line);
        font: 11px/1 ui-monospace, Menlo, Consolas, monospace;
        color: var(--ink-2);
      }
      #palette .body { overflow-y: auto; padding: 6px; }
      #palette .group + .group { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
      #palette .group-label {
        padding: 6px 10px 4px;
        font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--mute);
      }
      #palette .item {
        display: flex; align-items: center; gap: 10px;
        width: 100%;
        padding: 10px 12px; margin: 0;
        background: none; border: 0; border-radius: 8px;
        font: inherit; color: inherit; text-align: left; cursor: pointer;
        transition: background 0.12s ease;
      }
      #palette .item .icon {
        flex-shrink: 0; width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center;
        color: var(--mute);
      }
      #palette .item .label {
        flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #palette .item .meta {
        flex-shrink: 0;
        font-size: 12px; color: var(--mute);
      }
      #palette .item:hover,
      #palette .item.active {
        background: rgba(47, 107, 255, 0.08);
      }
      #palette .item:hover .icon,
      #palette .item.active .icon {
        color: var(--accent);
      }
      #palette .item:focus-visible {
        outline: 2px solid var(--accent); outline-offset: -2px;
      }
      #palette .empty {
        padding: 20px; text-align: center; color: var(--mute);
        font-size: 13px;
      }
    </style>
    <noscript>
      <style>
        .topbar, #drop, #stage { display: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Deck Player</div>
      <nav class="links">
        <a href="../" target="_blank" rel="noopener">About</a>
      </nav>
    </header>

    <main id="drop" aria-labelledby="hero-title">
      <div class="inner">
        <h1 id="hero-title" class="hero-title">Play your decks</h1>
        <p class="hero-tagline">
          Open any <code>.deck</code> presentation in your browser.
          Files stay on your device — nothing is uploaded.
        </p>

        <button id="browse" class="browse-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Choose a .deck file
        </button>
        <input id="file" type="file" accept=".deck,.zip" hidden />
        <p class="browse-hint">or drag a file anywhere on this page</p>

        <p id="status" aria-live="polite"></p>
        <p id="error" role="alert" aria-live="assertive"></p>

        <div id="recents"></div>

        <p class="hero-tip">
          <kbd>⌘K</kbd> opens the command palette once a deck is open.
        </p>
      </div>
    </main>

    <div id="stage">
      <!--
        sandbox: allow-same-origin is required so the deck's bundled
        scripts (e.g. Next.js exports) can use storage/fetch normally,
        and so the Service Worker can intercept its same-origin
        requests. Combined with allow-scripts, this means the iframe
        is NOT meaningfully sandboxed from the player — treat decks as
        trusted code. Popups and form submission are not granted.
      -->
      <!--
        allow="fullscreen": presentations commonly use the Fullscreen
        API to let the deck go edge-to-edge. Without this attribute
        iframe.requestFullscreen() rejects.
      -->
      <iframe id="frame"
              sandbox="allow-scripts allow-same-origin"
              allow="fullscreen"></iframe>
      <button id="home-indicator" type="button"
              aria-label="Open command palette"
              title="Open command palette (⌘K)"></button>
    </div>

    <!--
      Command palette: toggled by Cmd/Ctrl+K or "?". Populated dynamically
      from player.js — recents are read on each open so they reflect any
      changes made in another tab.
    -->
    <div id="palette" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
      <div class="panel">
        <div class="header">
          <span>Commands</span>
          <span class="hint"><kbd>Esc</kbd> to close</span>
        </div>
        <div class="body" id="palette-body"></div>
      </div>
    </div>

    <div id="undo-toast" role="status" aria-live="polite"></div>

    <noscript>
      <p style="margin: 24px; color: #dc2626">
        This player requires JavaScript.
      </p>
    </noscript>

    <!--
      JSZip is a UMD bundle that registers itself on `window.JSZip`.
      It must load BEFORE the module entry point because sw-client.js
      references the global. Plain (non-module) scripts execute during
      HTML parsing, while module scripts defer until after parsing —
      so the plain JSZip script always finishes first regardless of
      where it appears in the document, but we keep them ordered for
      readability and to be robust to future changes.
    -->
    <script
      src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"
      integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./player.js"></script>
  </body>
</html>
